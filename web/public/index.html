<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Operator — Sovereign Node</title>
<style>
  :root{--bg:#0b0d10;--panel:#14171c;--line:#232833;--paper:#e8ebf0;--muted:#8a93a3;
        --blue:#4a86ff;--green:#3fb950;--amber:#d9a441;--mono:ui-monospace,SFMono-Regular,Menlo,monospace}
  *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--paper);
    font:14px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  header{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--line);background:#0e1116}
  header .glyph{color:var(--blue);font-weight:700}
  header .sub{color:var(--muted);font-size:12px}
  header .law{margin-left:auto;color:var(--muted);font-size:11px;font-family:var(--mono)}
  nav{display:flex;gap:2px;padding:8px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  nav button{background:none;border:0;color:var(--muted);padding:7px 12px;border-radius:6px;cursor:pointer;font:inherit}
  nav button:hover{background:#1b1f27;color:var(--paper)}
  nav button.active{background:rgba(74,134,255,.16);color:var(--paper)}
  main{padding:18px;max-width:960px;margin:0 auto}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin-bottom:14px}
  .card h3{margin:0 0 10px;font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
  .row{display:flex;gap:16px;flex-wrap:wrap}
  .kv{font-family:var(--mono);font-size:12.5px;line-height:1.9}
  .kv .k{color:var(--muted)} .up{color:var(--green)} .down{color:var(--muted)} .warn{color:var(--amber)}
  pre.run{background:#080a0d;border:1px solid var(--line);border-radius:5px;padding:9px 11px;overflow-x:auto;
    font-family:var(--mono);font-size:12px;white-space:pre-wrap;color:#cdd6e4;margin:6px 0}
  .btn{background:#1b1f27;border:1px solid var(--line);color:var(--paper);padding:5px 10px;border-radius:5px;cursor:pointer;font:inherit;font-size:12px}
  .btn:hover{border-color:var(--blue)}
  .prop{border-left:2px solid var(--line);padding:8px 12px;margin:8px 0}
  .tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:3px;font-family:var(--mono)}
  .tag.chunk{background:rgba(63,185,80,.15);color:var(--green)} .tag.summary{background:rgba(217,164,65,.15);color:var(--amber)}
  .cite{font-family:var(--mono);font-size:11.5px;color:var(--blue)}
  input,textarea{width:100%;background:#0e1116;border:1px solid var(--line);color:var(--paper);border-radius:6px;padding:9px 11px;font:inherit;margin-top:6px}
  .note{color:var(--muted);font-size:11.5px;margin-top:8px}
  .miss{color:var(--amber);font-family:var(--mono);font-size:12px}
  .refuse{color:var(--muted);font-family:var(--mono);font-size:12px}
  a{color:var(--blue)}
</style>
</head>
<body>
<header>
  <span class="glyph">∞Δ∞</span>
  <div><b>Operator</b> <span class="sub">read &amp; draft · your node is the law · nothing here executes</span></div>
  <span class="law" id="law">loopback · GET-only to node</span>
</header>
<nav id="nav"></nav>
<main id="main"></main>

<script>
const NAV = [["needs","Needs You"],["apps","Apps"],["drills","Drills"],["morning","Morning"],["gates","Gates"],["capacity","Capacity"],
             ["passport","Passport"],["records","Records"],["corpus","Corpus"],["chat","Chat"],["receipts","Receipts"],["port","Port draft"]];
let cur = location.hash.slice(1) || "needs";

function esc(s){return (s??"").toString().replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));}
async function get(p){const r=await fetch(p);return r.json();}
async function post(p,b){const r=await fetch(p,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)});return r.json();}
function copyBtn(text){const id="c"+Math.random().toString(36).slice(2);
  setTimeout(()=>{const b=document.getElementById(id);if(b)b.onclick=()=>{navigator.clipboard.writeText(text);b.textContent="copied";setTimeout(()=>b.textContent="Copy",1200);};},0);
  return `<button id="${id}" class="btn">Copy</button>`;}
function runBlock(label,text){return text?`<div><span class="cite">${label}</span> ${copyBtn(text)}<pre class="run">${esc(text)}</pre></div>`:"";}

function nav(){document.getElementById("nav").innerHTML=NAV.map(([k,t])=>
  `<button class="${k===cur?'active':''}" onclick="go('${k}')">${t}</button>`).join("");}
function go(k){cur=k;location.hash=k;nav();render();}

function nodeDown(d){return `<div class="card"><h3>Node</h3><div class="miss">⚠ ${esc(d.stale||d.out_reason||'node unreachable')}</div>
  <div class="note">Facts are unknown, not fabricated. Start the node, then reload. Everything below is unavailable until it answers.</div></div>`;}

async function render(){
  const m=document.getElementById("main"); m.innerHTML="<div class='card'>Loading…</div>";
  try{ await PANELS[cur](m); }catch(e){ m.innerHTML=`<div class="card"><span class="miss">error: ${esc(e.message)}</span></div>`; }
}

const DRILLS=[
 {n:1,t:"Gate — raise → dispose → receipt",go:"port",cite:"BCK coordinated-capacity step 2–3 · graph: POST /api/v1/onboard/run + /breath_gate/&lt;id&gt;/approve|deny · tests: test_onboard_run_* · test_port_crossing_surfaces_gate_then_sanctions_value_free",steps:[
   "Port draft tab → draft a crossing (target <code>external-relay</code>, instruction <code>{&quot;send&quot;:&quot;ref://demo&quot;}</code>) → copy the RUN, run it in a terminal (this raises a PENDING gate).",
   "Gates tab → the pending gate appears with its exact APPROVE / DENY RUN text.",
   "Copy the DENY (or APPROVE→sanction) RUN → run on your keyboard / use the console Gate Inbox. The web never disposes.",
   "Receipts tab → the disposition / crossing_root receipt is visible. Verify: <code>curl /api/v1/audit/cylinders</code> or the sanction response hash."]},
 {n:2,t:"Capacity — renew / revoke (verbatim)",go:"capacity",cite:"BCK coordinated-capacity step 1 &amp; 6 · compute_share_offer / _pull · tests: test_t1_t4_delivery_and_receipt_verify · test_t3_over_units_refused_receipted_and_returned",steps:[
   "Capacity tab → each grant shows the node's OWN renew_run / revoke_run byte-for-byte.",
   "Copy RENEW → run in a terminal when a grant is near expiry; or REVOKE (<code>rm grant_*.json</code>) — the puller denies the next job ~5s later.",
   "Morning tab → grant days-left resets after a renew. The operator never issues; you do."]},
 {n:3,t:"Storage / material passport — one real datum",go:"passport",cite:"BCK coordinated-capacity step 5 · graph: POST /api/v1/storage/datum + /verify · tests: test_storage_store_get_verify_and_tamper_refusal · test_stored_datum_get_and_verify_survive_restart",steps:[
   "Passport tab → enter a real content ref (a serial, an insurance-PDF hash, an equipment serial) + why → Draft.",
   "Copy the RUN → run on your keyboard: it stores an owner-scoped, Merkle-bound datum.",
   "Passport tab → paste the returned datum id → Read it back to verify it's bound. The operator drafts; you store."]},
 {n:4,t:"Corpus — cite on-corpus + XRP→MISSING",go:"corpus",steps:[
   "Corpus tab → search an on-corpus topic (e.g. <i>immutable general ledger</i>) → every hit is a cited sealed chapter.",
   "Search <i>the XRP book</i> or <i>book 4 of the foundation series</i> → returns MISSING with the catalog row, never invented prose.",
   "Verify: the citation resolves to a real chapter; XRP has zero chunks by construction."]},
 {n:5,t:"Port draft — node untouched until you sanction",go:"port",cite:"BCK coordinated-capacity step 3 · graph: POST /api/v1/port/crossing + /sanction · test: test_port_crossing_surfaces_gate_then_sanctions_value_free · value-free receipt",steps:[
   "Port draft tab → draft a crossing → you get the exact RUN text, nothing more.",
   "The node is touched 0 times by the draft (verify: the node access log gains no line from the draft).",
   "Reaching outside the node is a Port crossing YOU sanction (owner-only). The Port carries a directive, never value."]},
];
const PANELS={
 async needs(m){
   const d=await get("/api/needs-you"), feeds=d.feeds||{}, k=d.kpi||{}, on=k.open_node||{};
   const feed=(name,x)=>`<span class="${x?.ok?'up':'warn'}">${name} ${x?.ok?'live':'unavailable'}</span>`;
   const cards=d.cards||[];
   m.innerHTML=`<div class="card"><h3>Needs You — exceptions and human decisions</h3>
     <div class="kv">${feed('node',feeds.node)} · ${feed('Port',feeds.port)} · <span class="k">observed</span> ${esc(feeds.port?.observed_at||'—')}</div>
     ${on.paint?`<div class="prop"><b>Open node</b> <span class="${on.click?'up':'warn'}">${esc(on.state)}</span><div class="note">${esc(on.paint)}</div><div class="note">${esc(on.detail||'')}</div></div>`:''}
     <div class="note">${esc(d.note||'')}</div></div>
     ${cards.length?cards.map(c=>`<div class="card"><h3>${esc(c.kind)} · ${esc(c.state)} · ${esc(c.source)}</h3>
       <b>${esc(c.what)}</b><div class="note" style="margin-top:6px">Why it rose: ${esc(c.why)}</div>
       <pre class="run">${esc(JSON.stringify(c.evidence,null,2))}</pre>
       ${c.exact_effect?`<div class="cite">Exact proposed effect</div><div>${esc(c.exact_effect)}</div>`:''}
       ${runBlock("APPROVE — DRAFT ONLY",c.run_approve)}${runBlock("DENY — DRAFT ONLY",c.run_deny)}
       <div class="note">${esc(c.disposition)}</div></div>`).join(''):
       '<div class="card"><div class="up">✓ Nothing currently crosses the human boundary.</div></div>'}`;
 },
 async apps(m){
   const d=await get("/api/apps"); const list=(d.ok&&d.apps)||[];
   m.innerHTML=`<div class="card"><h3>Apps — installed operator apps (private to this machine)</h3>
     <div class="note">An app is a PRIVATE instance under your operator home — never in the public repo. Install one to track its records under a mandate; uninstall removes it from the console with no trace. Install/uninstall is local config — it touches the node 0 times.</div>
     ${list.length?list.map(a=>`<div class="prop"><b>${esc(a.label||a.name)}</b> <span class="cite">${esc(a.name)}</span>
        <div class="kv"><span class="k">mandate</span> ${esc(a.mandate)} · <span class="k">records</span> ${(a.records||[]).length} · <span class="k">installed</span> ${esc(a.installed_at||'—')}</div>
        <div style="margin-top:6px"><button class="btn" onclick="window._recApp='${esc(a.name)}';go('records')">Open records →</button>
          <button class="btn" onclick="doAppUninstall('${esc(a.name)}')">Uninstall</button></div></div>`).join("")
       :'<div class="note">No apps installed. Install one below.</div>'}</div>
   <div class="card"><h3>Install an app (private)</h3>
     <input id="ainame" placeholder="app name — a lowercase slug, e.g. myops (no personal prose in the name)">
     <input id="aimand" placeholder="mandate — the scope its records live under" style="margin-top:8px">
     <input id="ailabel" placeholder="label (optional display name)" style="margin-top:8px">
     <div style="margin-top:8px"><button class="btn" onclick="doAppInstall()">Install</button></div>
     <div id="aiout" style="margin-top:10px"></div>
     <div class="note">Creates <code>~/.sovereign_operator/apps/&lt;name&gt;/</code> — private, never committed. No node call.</div></div>`;
 },
 async records(m){
   const ap=await get("/api/apps"); const list=(ap.ok&&ap.apps)||[];
   if(!list.length) return m.innerHTML=`<div class="card"><h3>Records index</h3><div class="note">No app installed. Install one in the Apps tab first.</div></div>`;
   const sel=window._recApp||list[0].name;
   const d=await get("/api/records?app="+encodeURIComponent(sel));
   const opts=list.map(a=>`<option value="${esc(a.name)}" ${a.name===sel?'selected':''}>${esc(a.label||a.name)}</option>`).join("");
   const chip=s=>s==='live'?'<span class="tag chunk">live</span>':(s==='MISSING'?'<span class="miss">MISSING</span>':'<span class="warn">unverified</span>');
   const rows=(d.ok&&d.records)||[];
   m.innerHTML=`<div class="card"><h3>Records index — live-verified against the node at render</h3>
     <select id="recsel" onchange="window._recApp=this.value;render()" style="width:auto;background:#0e1116;color:var(--paper);border:1px solid var(--line);border-radius:6px;padding:6px 10px">${opts}</select>
     <span class="note"> ${d.node_up?'node up — rows verified now':'node unreachable — rows shown as unverified, never fabricated'}</span>
     <div class="kv" style="margin-top:8px"><span class="k">live</span> ${d.counts?.live||0} · <span class="miss">MISSING</span> ${d.counts?.MISSING||0} · <span class="warn">unverified</span> ${d.counts?.unverified||0}</div>
     ${rows.length?rows.map(r=>`<div class="prop">${chip(r.state)} <span class="cite">${esc(r.id)}</span>
        ${r.state==='live'?`<div class="kv"><span class="k">root</span> ${esc((r.root||'').slice(0,24))}… · <span class="k">mandate</span> ${esc(r.mandate)}</div>`:`<div class="note">${esc(r.detail||'')}</div>`}
        ${r.note?`<div class="note">${esc(r.note)}</div>`:''}</div>`).join(""):'<div class="note">No records tracked yet. Store a datum (Passport tab), then track its id here.</div>'}
     <div style="margin-top:10px"><input id="trkid" placeholder="track a datum id under this app (from a stored receipt)" style="width:58%;display:inline-block">
       <button class="btn" onclick="doTrack('${esc(sel)}')">Track</button></div>
     <div class="note">A row is <b>live</b> only if the node holds it now · <b>MISSING</b> if the node answered and it is absent · <b>unverified</b> if the node could not be reached — never a fabricated record. Tracked ids are private to this app.</div></div>`;
 },
 async drills(m){
   m.innerHTML=`<div class="card"><h3>Cockpit drills — exercise the node over existing routes</h3>
     <div class="note">Each drill: read on the web, draft the exact command, dispose on your keyboard / the console, verify from receipts. The web reads and drafts — <b>it never executes against the node</b>. Propose-only drills (livelihood / succession / protection) are drafts only; no second-party or live-root change without a separate KM word.</div></div>
     ${DRILLS.map(d=>`<div class="card"><h3>Drill ${d.n} · ${d.t}</h3>
       <ol style="margin:6px 0 10px;padding-left:20px;line-height:1.7">${d.steps.map(s=>`<li>${s}</li>`).join("")}</ol>
       ${d.cite?`<div class="cite" style="margin:6px 0;font-size:11px">↔ ${d.cite}</div>`:""}
       <button class="btn" onclick="go('${d.go}')">Open the ${d.go} tab →</button></div>`).join("")}
     <div class="card"><h3>Fences (always)</h3><div class="note">No agent POST to the node · no self-approve (you dispose) · corpus cites or refuses · frontier only as a drafted crossing. Receipts appear only from real acts — never from asking a question.</div></div>`;
 },
 async passport(m){
   m.innerHTML=`<div class="card"><h3>Passport — store a real datum (draft only; you store on the keyboard)</h3>
     <input id="scontent" placeholder="content ref — a serial, a file hash, a record id (e.g. sha256:… or QR-PANEL-0042)">
     <input id="swhy" placeholder="why (e.g. equipment provenance)" style="margin-top:8px">
     <div style="margin-top:8px"><button class="btn" onclick="doStorageDraft()">Draft store RUN</button></div>
     <div id="sdraft" style="margin-top:10px"></div>
     <div class="note">This drafts the exact <code>POST /storage/datum</code> command; it does NOT store. Datums are owner-scoped &amp; Merkle-bound. Run it on your keyboard, then verify below.</div></div>
   <div class="card"><h3>Read a datum (confirm it's bound)</h3>
     <input id="sid" placeholder="datum id (from the stored receipt)">
     <div style="margin-top:8px"><button class="btn" onclick="doStorageRead()">Read datum</button></div>
     <div id="sread" style="margin-top:10px"></div></div>
   <div class="card"><h3>Verify a datum (draft — integrity check on your keyboard)</h3>
     <input id="vid" placeholder="datum id">
     <input id="vc" placeholder="the same content ref you stored (re-hash source to match)" style="margin-top:8px">
     <div style="margin-top:8px"><button class="btn" onclick="doStorageVerify()">Draft verify RUN</button></div>
     <div id="vout" style="margin-top:10px"></div>
     <div class="note">Drafts <code>POST /storage/datum/&lt;id&gt;/verify</code>; run it on your keyboard to confirm the stored hash matches the source. The web surface drafts, never posts.</div></div>`;
 },
 async morning(m){
   const d=await get("/api/morning");
   if(!d.ok) return m.innerHTML=nodeDown(d);
   const f=d.facts, g=f.gpu||{};
   const gpu=g.state==="ok"?`${g.free_mib}/${g.total_mib} MiB free · ${g.util_pct}% util`:`${g.note||'no gpu'} [${g.state}]`;
   m.innerHTML=`
   <div class="card"><h3>Node status (facts)</h3><div class="kv">
     <span class="k">fp</span> ${esc(f.node_fp)}<br>
     <span class="k">gpu</span> ${esc(gpu)}<br>
     <span class="k">peers</span> ${f.peers?.count||0} ${esc((f.peers?.labels||[]).join(", "))}<br>
     <span class="k">grants</span> ${(f.grants||[]).length} · units offered ${f.units_offered}<br>
     <span class="k">puller</span> <span class="${f.puller_running?'up':'down'}">${f.puller_running?'running':'stopped'}</span>
       · model <span class="${f.model_up?'up':'down'}">${f.model_up?'up':'down'}</span>
       · gates <span class="${d.pending_gates?'warn':'up'}">${d.pending_gates??'?'} pending</span>
   </div></div>
   <div class="card"><h3>LGP lens (facts vs memory, labeled)</h3><pre class="run">${esc(d.lens)}</pre></div>`;
 },
 async gates(m){
   const d=await get("/api/gates");
   if(!d.ok) return m.innerHTML=nodeDown(d);
   if(!d.count) return m.innerHTML=`<div class="card"><h3>Gate inbox</h3><div class="up">✓ clear — no pending acts.</div></div>`;
   m.innerHTML=`<div class="card"><h3>Pending gates — you dispose (owner-only)</h3>${d.gates.map(x=>{
     const r=x.gate.request||{}, p=x.gate.provenance||{}, dz=x.dispose||{};
     return `<div class="prop"><b>${esc(r.action_class||x.gate.req_id)}</b>
       <div class="kv"><span class="k">id</span> ${esc(x.gate.req_id)} · <span class="k">risk</span> ${esc(r.risk_level||'?')}
        · <span class="k">boundary</span> ${esc(p.boundary||'—')} · <span class="k">src</span> ${esc(p.source||'kernel')}</div>
       ${runBlock("APPROVE (RUN)",dz.RUN_approve)}${runBlock("DENY (RUN)",dz.RUN_deny)}</div>`;}).join("")}
     <div class="note">${esc(d.note)}</div></div>`;
 },
 async capacity(m){
   const d=await get("/api/capacity");
   if(!d.ok) return m.innerHTML=nodeDown(d);
   const props=d.data?.proposals||[];
   m.innerHTML=`<div class="card"><h3>Capacity — offer / renew / revoke (you issue)</h3>
     ${props.length?props.map(p=>`<div class="prop"><b>${esc(p.peer)}</b> · expires ${esc(p.expires)} · models ${esc(JSON.stringify(p.models))}
       ${runBlock("RENEW 7d (RUN)",p.renew_run)}${runBlock("REVOKE (RUN)",p.revoke_run)}</div>`).join(""):'<div class="note">no grants present</div>'}
     <div class="note">${esc(d.data?.gate||'')}</div></div>`;
 },
 async corpus(m){
   m.innerHTML=`<div class="card"><h3>Corpus — search the sealed shelf (cite-or-refuse)</h3>
     <input id="cq" placeholder="e.g. immutable general ledger with human oversight" onkeydown="if(event.key==='Enter')doCorpus()">
     <div style="margin-top:8px"><button class="btn" onclick="doCorpus()">Search</button></div>
     <div id="cout" style="margin-top:10px"></div>
     <div class="note">Every result is a cited sealed chunk, or the corpus refuses. XRP (S0-04) returns MISSING — never invented prose.</div></div>`;
 },
 async chat(m){
   m.innerHTML=`<div class="card"><h3>Chat — the node's local mind (loopback; reads &amp; proposes)</h3>
     <textarea id="cp" rows="3" placeholder="Is my node earning tonight? what expires soon? what should I do?"></textarea>
     <div style="margin-top:8px"><button class="btn" onclick="doChat()">Ask</button> <span class="note" id="cmodel"></span></div>
     <div id="chout" style="margin-top:12px"></div>
     <div class="note">Loopback model only. It never executes — consequential acts come back as PROPOSE / RUN / GATE for your keyboard. A frontier model is only ever a drafted, labeled Port crossing you sanction.</div></div>`;
 },
 async receipts(m){
   const d=await get("/api/receipts");
   const inf=(d.inference?.receipts)||[], aud=(d.audit?.cylinders)||[];
   m.innerHTML=`<div class="card"><h3>Receipts — what actually happened</h3>
     <div class="kv"><span class="k">inference receipts</span> ${inf.length}<br><span class="k">audit cylinders</span> ${aud.length}</div>
     ${inf.length||aud.length?'<pre class="run">'+esc(JSON.stringify({inference:inf.slice(0,8),audit:aud.slice(0,8)},null,2))+'</pre>'
       :'<div class="note">No gated acts recorded yet. Receipts appear when you sanction a crossing, dispose a gate, or a compute job completes — never from asking a question.</div>'}</div>`;
 },
 async port(m){
   m.innerHTML=`<div class="card"><h3>Port crossing — draft only (you sanction on the keyboard)</h3>
     <input id="pt" placeholder="target (e.g. external-relay)">
     <input id="pi" placeholder='instruction JSON (e.g. {"send":"ref://demo"})' style="margin-top:8px">
     <input id="pw" placeholder="why (rationale)" style="margin-top:8px">
     <div style="margin-top:8px"><button class="btn" onclick="doPort()">Draft crossing</button></div>
     <div id="pout" style="margin-top:10px"></div>
     <div class="note">This drafts the exact RUN command; it does NOT open the crossing. Reaching outside the node is a Port crossing you sanction by hand (owner-only). The Port carries a directive, never value.</div></div>`;
 },
};

async function doCorpus(){
  const q=document.getElementById("cq").value.trim(); const o=document.getElementById("cout");
  if(!q)return; o.innerHTML="Searching…";
  const d=await get("/api/corpus?q="+encodeURIComponent(q));
  if(d.missing) return o.innerHTML=`<div class="miss">MISSING — ${esc(d.reason)}</div><div class="cite">${esc(d.citation)}</div>`;
  if(!d.ok) return o.innerHTML=`<div class="refuse">${esc(d.refuse||d.out_reason)}</div>`;
  o.innerHTML=(d.results||[]).map(h=>`<div class="prop"><span class="tag ${h.kind}">${h.kind}</span>
    <span class="cite">${esc(h.citation)}</span> · <span class="note">score ${h.score}</span>
    <div style="margin-top:6px">${esc(h.text)}</div></div>`).join("");
}
async function doChat(){
  const p=document.getElementById("cp").value.trim(); const o=document.getElementById("chout");
  if(!p)return; o.innerHTML="Thinking on the local model…";
  const d=await post("/api/chat",{prompt:p});
  document.getElementById("cmodel").textContent=d.model?("model: "+d.model):"(no local model — facts + proposals only)";
  const props=(d.proposals?.proposals)||[];
  o.innerHTML=`<div style="white-space:pre-wrap;margin-bottom:12px">${esc(d.answer)}</div>
    <div class="note">facts: ${esc(d.facts_digest)}</div>
    ${props.length?'<h3 style="margin-top:12px">Exact proposals (copy to keyboard)</h3>'+props.map(x=>
      `<div class="prop"><b>${esc(x.peer)}</b> · expires ${esc(x.expires)}${runBlock("RENEW",x.renew_run)}${runBlock("REVOKE",x.revoke_run)}</div>`).join(""):''}`;
}
async function doPort(){
  const t=document.getElementById("pt").value.trim(), w=document.getElementById("pw").value.trim();
  let inst={}; try{inst=JSON.parse(document.getElementById("pi").value||"{}");}catch(e){document.getElementById("pout").innerHTML='<div class="miss">instruction must be valid JSON</div>';return;}
  const d=await post("/api/draft/crossing",{target:t,instruction:inst,why:w});
  const o=document.getElementById("pout");
  if(!d.ok) return o.innerHTML=`<div class="refuse">${esc(d.out_reason||d.error)}</div>`;
  o.innerHTML=`<div class="prop"><b>PROPOSE:</b> ${esc(d.data.PROPOSE)}${runBlock("RUN",d.data.RUN)}<div class="note">${esc(d.data.GATE)}</div></div>`;
}
async function doStorageDraft(){
  const c=document.getElementById("scontent").value.trim(), w=document.getElementById("swhy").value.trim();
  const o=document.getElementById("sdraft"); if(!c){o.innerHTML='<div class="miss">content ref required</div>';return;}
  const d=await post("/api/draft/storage",{content_ref:c,why:w});
  if(!d.ok) return o.innerHTML=`<div class="refuse">${esc(d.out_reason||d.error)}</div>`;
  o.innerHTML=`<div class="prop"><b>PROPOSE:</b> ${esc(d.data.PROPOSE)}${runBlock("RUN",d.data.RUN)}<div class="note">${esc(d.data.GATE)}</div></div>`;
}
async function doStorageRead(){
  const id=document.getElementById("sid").value.trim(); const o=document.getElementById("sread");
  if(!id){o.innerHTML='<div class="miss">datum id required</div>';return;}
  const d=await get("/api/storage?id="+encodeURIComponent(id));
  o.innerHTML = d.ok ? `<pre class="run">${esc(JSON.stringify(d.data,null,2))}</pre>`
    : `<div class="refuse">${esc(d.out_reason||d.error||JSON.stringify(d))}</div>`;
}
async function doStorageVerify(){
  const id=document.getElementById("vid").value.trim(), c=document.getElementById("vc").value.trim();
  const o=document.getElementById("vout"); if(!id||!c){o.innerHTML='<div class="miss">datum id + content required</div>';return;}
  const d=await post("/api/draft/verify",{datum_id:id,content:c});
  if(!d.ok) return o.innerHTML=`<div class="refuse">${esc(d.out_reason||d.error)}</div>`;
  o.innerHTML=`<div class="prop"><b>PROPOSE:</b> ${esc(d.data.PROPOSE)}${runBlock("RUN",d.data.RUN)}<div class="note">${esc(d.data.GATE)}</div></div>`;
}
async function doAppInstall(){
  const name=document.getElementById("ainame").value.trim(), mandate=document.getElementById("aimand").value.trim(), label=document.getElementById("ailabel").value.trim();
  const o=document.getElementById("aiout"); if(!name||!mandate){o.innerHTML='<div class="miss">name and mandate required</div>';return;}
  const d=await post("/api/apps/install",{name,mandate,label,at:new Date().toISOString()});
  if(!d.ok){o.innerHTML=`<div class="refuse">${esc(d.out_reason||d.error)}</div>`;return;}
  o.innerHTML=`<div class="up">✓ installed ${esc(name)} (private — under your operator home, not the repo)</div>`; setTimeout(render,500);
}
async function doAppUninstall(name){
  if(!confirm("Uninstall app '"+name+"'? Removes its PRIVATE instance from the console. No node change.")) return;
  await post("/api/apps/uninstall",{name}); if(window._recApp===name)window._recApp=null; render();
}
async function doTrack(name){
  const el=document.getElementById("trkid"); const id=(el&&el.value.trim())||""; if(!id)return;
  await post("/api/apps/track",{name,id}); render();
}
nav(); render();
</script>
